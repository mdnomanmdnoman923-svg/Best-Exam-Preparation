    <style>
      :root {
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;

        width: 100%;
        min-height: 100vh;

        background:
          radial-gradient(
            circle at top left,
            rgba(34, 211, 238, 0.12),
            transparent 28%
          ),
          radial-gradient(
            circle at bottom right,
            rgba(168, 85, 247, 0.1),
            transparent 24%
          ),
          #050816;

        color: white;

        font-family:
          Inter,
          system-ui,
          sans-serif;

        overflow-x: hidden;
      }

      #root {
        min-height: 100vh;
      }

      .bep-loader {
        position: fixed;
        inset: 0;

        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;

        gap: 20px;

        background:
          radial-gradient(
            circle at center,
            rgba(34, 211, 238, 0.08),
            transparent 40%
          ),
          #050816;

        z-index: 9999;
      }

      .bep-loader-logo {
        width: 84px;
        height: 84px;

        border-radius: 24px;

        background:
          linear-gradient(
            135deg,
            #22d3ee,
            #a855f7
          );

        display: flex;
        align-items: center;
        justify-content: center;

        font-size: 2rem;
        font-weight: 800;

        box-shadow:
          0 0 40px rgba(34, 211, 238, 0.25);

        animation:
          loader-float 3s ease-in-out infinite,
          loader-glow 2.5s ease-in-out infinite;
      }

      .bep-loader-title {
        font-size: 1.2rem;
        font-weight: 700;

        letter-spacing: -0.03em;
      }

      .bep-loader-subtitle {
        color: rgba(255, 255, 255, 0.68);

        font-size: 0.92rem;
      }

      .bep-loader-bar {
        width: 220px;
        height: 8px;

        border-radius: 999px;

        overflow: hidden;

        background:
          rgba(255, 255, 255, 0.08);

        position: relative;
      }

      .bep-loader-progress {
        position: absolute;
        inset: 0;

        width: 40%;

        border-radius: inherit;

        background:
          linear-gradient(
            90deg,
            #22d3ee,
            #a855f7
          );

        animation:
          loader-progress 1.6s ease infinite;
      }

      @keyframes loader-progress {
        0% {
          transform: translateX(-120%);
        }

        100% {
          transform: translateX(320%);
        }
      }

      @keyframes loader-float {
        0% {
          transform: translateY(0);
        }

        50% {
          transform: translateY(-8px);
        }

        100% {
          transform: translateY(0);
        }
      }

      @keyframes loader-glow {
        0% {
          box-shadow:
            0 0 20px rgba(34, 211, 238, 0.15);
        }

        50% {
          box-shadow:
            0 0 50px rgba(34, 211, 238, 0.32);
        }

        100% {
          box-shadow:
            0 0 20px rgba(34, 211, 238, 0.15);
        }
      }

      @media (max-width: 640px) {
        .bep-loader-logo {
          width: 72px;
          height: 72px;

          font-size: 1.7rem;
        }

        .bep-loader-title {
          font-size: 1rem;
        }

        .bep-loader-subtitle {
          font-size: 0.85rem;
        }

        .bep-loader-bar {
          width: 180px;
        }
      }
    </style>
  </head>
